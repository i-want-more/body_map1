<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Body Map Editor</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
        }

        .app {
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 22px;
        }

        .body-map {
            position: relative;
            width: 250px;
            margin: 20px auto;
        }

        .body-map img {
            width: 250px;
            height: 700px;
            display: block;
        }

        .zones {
            position: absolute;
            top: 0;
            left: 0;
            width: 250px;
            height: 700px;
        }

        .zone {
            fill: rgba(255, 170, 0, 0.45);
            stroke: orange;
            stroke-width: 2;
        }

        .point {
            fill: red;
        }

        button {
            padding: 10px 16px;
            margin: 5px;
            cursor: pointer;
        }

        input {
            padding: 10px;
            width: 200px;
        }

        #zonesList {
            margin-top: 20px;
            text-align: left;
        }

        .zone-item {
            background: white;
            padding: 10px;
            margin-bottom: 5px;
        }

    </style>

</head>


<body>

<div class="app">

    <h1>Редактор зон тела</h1>

    <input
        id="zoneName"
        type="text"
        placeholder="Название зоны"
    >

    <div class="body-map">

        <img src="body.png" alt="Body">

        <svg
            class="zones"
            viewBox="0 0 250 700"
        >

            <!-- Здесь будут появляться зоны -->

            <polygon
                id="currentZone"
                class="zone"
                points=""
            />

        </svg>

    </div>


    <div>

        <button onclick="undoPoint()">
            Отменить точку
        </button>

        <button onclick="finishZone()">
            Завершить зону
        </button>

        <button onclick="clearCurrentZone()">
            Очистить
        </button>

    </div>


    <div id="zonesList"></div>


</div>


<script>

    const svg = document.querySelector('.zones');

    const currentZone =
        document.querySelector('#currentZone');

    const zoneName =
        document.querySelector('#zoneName');

    const zonesList =
        document.querySelector('#zonesList');


    let points = [];

    let zones = [];


    // Клик по изображению

    svg.addEventListener('click', function(event) {

        const rect =
            svg.getBoundingClientRect();


        const x =
            (event.clientX - rect.left)
            * 250 / rect.width;


        const y =
            (event.clientY - rect.top)
            * 700 / rect.height;


        points.push({

            x: Math.round(x),

            y: Math.round(y)

        });


        updateCurrentZone();

    });


    // Обновляем текущую область

    function updateCurrentZone() {

        const pointsString = points

            .map(point =>
                `${point.x},${point.y}`
            )

            .join(' ');


        currentZone.setAttribute(
            'points',
            pointsString
        );

    }


    // Отменить последнюю точку

    function undoPoint() {

        points.pop();

        updateCurrentZone();

    }


    // Завершить зону

    function finishZone() {

        if (points.length < 3) {

            alert(
                'Нужно поставить минимум 3 точки'
            );

            return;

        }


        const name =
            zoneName.value.trim();


        if (!name) {

            alert(
                'Введите название зоны'
            );

            return;

        }


        const pointsCopy =
            [...points];


        zones.push({

            name: name,

            points: pointsCopy

        });


        // Создаём SVG polygon

        const polygon =
            document.createElementNS(
                'http://www.w3.org/2000/svg',
                'polygon'
            );


        polygon.setAttribute(
            'class',
            'zone'
        );


        polygon.setAttribute(
            'points',
            pointsCopy
                .map(point =>
                    `${point.x},${point.y}`
                )
                .join(' ')
        );


        svg.insertBefore(
            polygon,
            currentZone
        );


        // Очищаем текущую область

        points = [];

        currentZone.setAttribute(
            'points',
            ''
        );


        zoneName.value = '';


        updateZonesList();

    }


    // Очистить текущую область

    function clearCurrentZone() {

        points = [];

        currentZone.setAttribute(
            'points',
            ''
        );

    }


    // Показываем список зон

    function updateZonesList() {

        zonesList.innerHTML =
            '<h3>Созданные зоны:</h3>';


        zones.forEach(function(zone, index) {

            const item =
                document.createElement('div');


            item.className =
                'zone-item';


            item.innerHTML =

                `${index + 1}. ${zone.name}`;


            zonesList.appendChild(item);

        });

    }

</script>

</body>

</html>
