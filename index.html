<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Yoga Body Map</title>

    <style>
        body {
            margin: 0;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
        }

        .body-map {
            position: relative;
            width: 250px;
            max-width: 100%;
        }

        .body-map img {
            width: 100%;
            display: block;
        }
        .zones {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .zone {
            fill: rgba(255, 170, 0, 0.5);
        }
    </style>
</head>

<body>

    <div class="body-map">
    
        <img src="body.png" alt="Body map">
    
        <svg class="zones" viewBox="0 0 250 700">
    
            <path
                class="zone"
                d="
                    M 85 320
                    C 100 310, 150 310, 165 320
                    C 155 345, 155 375, 165 395
                    C 145 410, 105 410, 85 395
                    C 95 375, 95 345, 85 320
                    Z
                "
            />
    
        </svg>
    
    </div>
</body>
</html>
