<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Редактор полигонов</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    display: flex;
    justify-content: center;
}

.app {
    width: 100%;
    max-width: 600px;
    padding: 20px;
    box-sizing: border-box;
}

h1 {
    font-size: 22px;
    text-align: center;
}

.controls {
    background: white;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
}

button {
    padding: 10px 15px;
    margin: 4px;
    cursor: pointer;
}

input {
    padding: 8px;
}

.message {
    margin-top: 10px;
    padding: 10px;
    background: #fff3cd;
    border-radius: 6px;
    display: none;
}


/* Тело */

.body-map {
    position: relative;
    width: 250px;
    margin: 20px auto;
}

.body-map img {
    width: 250px;
    height: 700px;
    display: block;
}

svg {
    position: absolute;
    left: 0;
    top: 0;
    width: 250px;
    height: 700px;
    overflow: visible;
}


/* Полигон */

.polygon {
    fill: rgba(255, 170, 0, 0.4);
    stroke: orange;
    stroke-width: 2;
    cursor: pointer;
}

.polygon.selected {
    fill: rgba(0, 150, 255, 0.4);
    stroke: blue;
}


/* Вершины */

.vertex {
    fill: white;
    stroke: #222;
    stroke-width: 2;
    cursor: move;
}

.vertex:hover {
    fill: orange;
}


/*
Точка для добавления новой вершины.

Она полностью скрыта по умолчанию.
*/

.midpoint {
    fill: white;
    stroke: #333;
    stroke-width: 1.5;
    cursor: pointer;

    opacity: 0;

    pointer-events: none;
}


/*
Показываем midpoint,
когда соответствующая сторона находится
под курсором.
*/

.midpoint.visible {
    opacity: 1;
    pointer-events: auto;
}


/*
Невидимая зона над каждой стороной.
Она нужна, чтобы не нужно было попадать
курсором точно в тонкую линию.
*/

.edge-hit {
    fill: none;
    stroke: transparent;
    stroke-width: 14px;
    cursor: crosshair;
}


.parameters {
    background: white;
    padding: 15px;
    border-radius: 10px;
    margin-top: 20px;
}

textarea {
    width: 100%;
    box-sizing: border-box;
    min-height: 110px;
    padding: 10px;
    font-family: monospace;
    font-size: 13px;
    resize: vertical;
}

.delete-button {
    background: #eee;
    border: 1px solid #ccc;
}

.polygon-item {
    background: white;
    padding: 12px;
    margin-top: 8px;
    border-radius: 8px;
}

.path-preview {
    margin-top: 10px;
    padding: 10px;
    background: #f5f5f5;
    border-radius: 6px;
    font-family: monospace;
    font-size: 12px;
    word-break: break-all;
}

</style>
</head>


<body>

<div class="app">

<h1>Редактор полигонов</h1>


<div class="controls">

    <input
        id="polygonName"
        type="text"
        placeholder="Название зоны"
    >

    <br>

    <button id="startButton">
        Создать полигон
    </button>

    <button id="finishButton">
        Завершить
    </button>

    <div
        id="message"
        class="message"
    >
        Кликайте по силуэту, чтобы создавать вершины.
    </div>

</div>


<div class="body-map">

    <img
        src="body.png"
        alt="Силуэт человека"
    >

    <svg
        id="svg"
        viewBox="0 0 250 700"
    ></svg>

</div>


<!-- Параметры выбранного полигона -->

<div
    id="parameters"
    class="parameters"
    style="display:none;"
>

    <strong>
        Выбранный полигон
    </strong>


    <p>
        Название:
    </p>

    <input
        id="selectedName"
        type="text"
    >


    <p>
        SVG path с координатами:
    </p>

    <textarea
        id="pathOutput"
        readonly
    ></textarea>


    <button
        id="deleteButton"
        class="delete-button"
    >
        Удалить полигон
    </button>

</div>


<div id="polygonList"></div>

</div>



<script>


/* =====================================================
   ОСНОВНЫЕ ПЕРЕМЕННЫЕ
===================================================== */

const svg =
    document.getElementById('svg');

const startButton =
    document.getElementById('startButton');

const finishButton =
    document.getElementById('finishButton');

const message =
    document.getElementById('message');

const polygonName =
    document.getElementById('polygonName');

const parameters =
    document.getElementById('parameters');

const selectedName =
    document.getElementById('selectedName');

const pathOutput =
    document.getElementById('pathOutput');

const deleteButton =
    document.getElementById('deleteButton');

const polygonList =
    document.getElementById('polygonList');


let polygons = [];

let selectedPolygon = null;

let drawing = false;

let drawingPoints = [];

let temporaryPolygon = null;

let draggingVertex = null;


/* =====================================================
   СОЗДАНИЕ ПОЛИГОНА
===================================================== */

startButton.addEventListener(
    'click',
    startDrawing
);


function startDrawing() {

    if (drawing) {
        return;
    }

    drawing = true;

    drawingPoints = [];

    message.style.display = 'block';

    startButton.disabled = true;


    temporaryPolygon =
        document.createElementNS(
            'http://www.w3.org/2000/svg',
            'polygon'
        );


    temporaryPolygon.setAttribute(
        'fill',
        'rgba(255,170,0,0.25)'
    );

    temporaryPolygon.setAttribute(
        'stroke',
        'orange'
    );

    temporaryPolygon.setAttribute(
        'stroke-width',
        '2'
    );


    svg.appendChild(
        temporaryPolygon
    );

}


/* =====================================================
   КЛИКИ ПРИ СОЗДАНИИ
===================================================== */

svg.addEventListener(
    'click',
    function(event) {

        if (!drawing) {
            return;
        }


        if (
            event.target.classList.contains('vertex') ||
            event.target.classList.contains('midpoint') ||
            event.target.classList.contains('edge-hit')
        ) {
            return;
        }


        const point =
            getSVGPoint(event);


        drawingPoints.push(point);


        updateTemporaryPolygon();

    }
);


/* =====================================================
   КООРДИНАТЫ SVG
===================================================== */

function getSVGPoint(event) {

    const rect =
        svg.getBoundingClientRect();


    const scaleX =
        250 / rect.width;

    const scaleY =
        700 / rect.height;


    return {

        x: Math.round(
            (event.clientX - rect.left)
            * scaleX
        ),

        y: Math.round(
            (event.clientY - rect.top)
            * scaleY
        )

    };

}


/* =====================================================
   ВРЕМЕННЫЙ ПОЛИГОН
===================================================== */

function updateTemporaryPolygon() {

    temporaryPolygon.setAttribute(
        'points',

        drawingPoints
            .map(
                point =>
                    `${point.x},${point.y}`
            )
            .join(' ')
    );

}


/* =====================================================
   ЗАВЕРШЕНИЕ ПОЛИГОНА
===================================================== */

finishButton.addEventListener(
    'click',
    finishDrawing
);


function finishDrawing() {

    if (!drawing) {
        return;
    }


    if (drawingPoints.length < 3) {

        alert(
            'Нужно минимум 3 вершины'
        );

        return;

    }


    const name =
        polygonName.value.trim()
        || `Зона ${polygons.length + 1}`;


    temporaryPolygon.remove();


    const polygonElement =
        document.createElementNS(
            'http://www.w3.org/2000/svg',
            'polygon'
        );


    polygonElement.setAttribute(
        'class',
        'polygon'
    );


    const data = {

        name: name,

        points:
            drawingPoints.map(
                point => ({
                    x: point.x,
                    y: point.y
                })
            ),

        element: polygonElement,

        vertices: [],

        midpoints: [],

        edgeHits: []

    };


    polygonElement.setAttribute(
        'points',
        pointsToString(data.points)
    );


    svg.appendChild(
        polygonElement
    );


    polygons.push(data);


    polygonElement.addEventListener(
        'click',
        function(event) {

            event.stopPropagation();

            selectPolygon(data);

        }
    );


    createPolygonControls(data);


    drawing = false;

    drawingPoints = [];

    temporaryPolygon = null;

    message.style.display = 'none';

    startButton.disabled = false;

    polygonName.value = '';


    updateList();

    selectPolygon(data);

}


/* =====================================================
   POINTS → SVG
===================================================== */

function pointsToString(points) {

    return points
        .map(
            point =>
                `${point.x},${point.y}`
        )
        .join(' ');

}


/* =====================================================
   СОЗДАНИЕ ЭЛЕМЕНТОВ РЕДАКТИРОВАНИЯ
===================================================== */

function createPolygonControls(polygon) {

    removePolygonControls(polygon);


    polygon.vertices = [];

    polygon.midpoints = [];

    polygon.edgeHits = [];


    /* =================================================
       ВЕРШИНЫ
    ================================================= */

    polygon.points.forEach(
        (point, index) => {

            const vertex =
                document.createElementNS(
                    'http://www.w3.org/2000/svg',
                    'circle'
                );


            vertex.setAttribute(
                'class',
                'vertex'
            );


            vertex.setAttribute(
                'r',
                '5'
            );


            vertex.setAttribute(
                'cx',
                point.x
            );


            vertex.setAttribute(
                'cy',
                point.y
            );


            svg.appendChild(vertex);


            polygon.vertices.push(
                vertex
            );


            /* Начало drag */

            vertex.addEventListener(
                'pointerdown',
                function(event) {

                    event.stopPropagation();

                    draggingVertex = {

                        polygon: polygon,

                        index: index

                    };


                    vertex.setPointerCapture(
                        event.pointerId
                    );

                }
            );


            /* Перемещение */

            vertex.addEventListener(
                'pointermove',
                function(event) {

                    if (
                        !draggingVertex
                    ) {
                        return;
                    }


                    if (
                        draggingVertex.polygon
                        !== polygon
                    ) {
                        return;
                    }


                    if (
                        draggingVertex.index
                        !== index
                    ) {
                        return;
                    }


                    const point =
                        getSVGPoint(event);


                    polygon.points[index] =
                        point;


                    updatePolygon(polygon);

                }
            );


            /* Конец drag */

            vertex.addEventListener(
                'pointerup',
                function(event) {

                    draggingVertex = null;


                    try {

                        vertex.releasePointerCapture(
                            event.pointerId
                        );

                    } catch {}

                }
            );

        }
    );


    /* =================================================
       СТОРОНЫ
    ================================================= */

    polygon.points.forEach(
        (point, index) => {

            const next =
                polygon.points[
                    (index + 1)
                    % polygon.points.length
                ];


            const midpoint = {

                x:
                    (point.x + next.x) / 2,

                y:
                    (point.y + next.y) / 2

            };


            /*
            Невидимая широкая область
            над стороной.
            */

            const edgeHit =
                document.createElementNS(
                    'http://www.w3.org/2000/svg',
                    'line'
                );


            edgeHit.setAttribute(
                'class',
                'edge-hit'
            );


            edgeHit.setAttribute(
                'x1',
                point.x
            );

            edgeHit.setAttribute(
                'y1',
                point.y
            );

            edgeHit.setAttribute(
                'x2',
                next.x
            );

            edgeHit.setAttribute(
                'y2',
                next.y
            );


            /*
            Ставим edge-hit перед
            остальными элементами,
            чтобы вершины оставались сверху.
            */

            svg.insertBefore(
                edgeHit,
                polygon.element
            );


            polygon.edgeHits.push(
                edgeHit
            );


            /*
            Маленькая точка
            */

            const midpointElement =
                document.createElementNS(
                    'http://www.w3.org/2000/svg',
                    'circle'
                );


            midpointElement.setAttribute(
                'class',
                'midpoint'
            );


            midpointElement.setAttribute(
                'r',
                '4'
            );


            midpointElement.setAttribute(
                'cx',
                midpoint.x
            );


            midpointElement.setAttribute(
                'cy',
                midpoint.y
            );


            svg.appendChild(
                midpointElement
            );


            polygon.midpoints.push(
                midpointElement
            );


            /*
            Наведение на сторону
            */

            edgeHit.addEventListener(
                'mouseenter',
                function() {

                    midpointElement.classList.add(
                        'visible'
                    );

                }
            );


            edgeHit.addEventListener(
                'mouseleave',
                function() {

                    midpointElement.classList.remove(
                        'visible'
                    );

                }
            );


            /*
            Если курсор переходит
            непосредственно на точку,
            она остаётся видимой.
            */

            midpointElement.addEventListener(
                'mouseenter',
                function() {

                    midpointElement.classList.add(
                        'visible'
                    );

                }
            );


            midpointElement.addEventListener(
                'mouseleave',
                function() {

                    midpointElement.classList.remove(
                        'visible'
                    );

                }
            );


            /*
            Клик по midpoint
            */

            midpointElement.addEventListener(
                'click',
                function(event) {

                    event.stopPropagation();


                    polygon.points.splice(
                        index + 1,
                        0,
                        midpoint
                    );


                    updatePolygon(
                        polygon
                    );

                }
            );

        }
    );

}


/* =====================================================
   УДАЛЕНИЕ HANDLE
===================================================== */

function removePolygonControls(polygon) {

    if (polygon.vertices) {

        polygon.vertices.forEach(
            vertex =>
                vertex.remove()
        );

    }


    if (polygon.midpoints) {

        polygon.midpoints.forEach(
            point =>
                point.remove()
        );

    }


    if (polygon.edgeHits) {

        polygon.edgeHits.forEach(
            edge =>
                edge.remove()
        );

    }

}


/* =====================================================
   ОБНОВЛЕНИЕ POLYGON
===================================================== */

function updatePolygon(polygon) {

    polygon.element.setAttribute(
        'points',
        pointsToString(
            polygon.points
        )
    );


    createPolygonControls(
        polygon
    );


    updatePathOutput(
        polygon
    );


    updateList();

}


/* =====================================================
   ВЫБОР POLYGON
===================================================== */

function selectPolygon(polygon) {

    selectedPolygon =
        polygon;


    polygons.forEach(
        item => {

            item.element.classList.remove(
                'selected'
            );

        }
    );


    polygon.element.classList.add(
        'selected'
    );


    parameters.style.display =
        'block';


    selectedName.value =
        polygon.name;


    updatePathOutput(
        polygon
    );

}


/* =====================================================
   СОЗДАНИЕ SVG PATH
===================================================== */

function polygonToPath(polygon) {

    if (
        !polygon.points.length
    ) {
        return '';
    }


    let path =
        `M ${polygon.points[0].x} ${polygon.points[0].y}`;


    for (
        let i = 1;
        i < polygon.points.length;
        i++
    ) {

        path +=
            ` L ${polygon.points[i].x} ${polygon.points[i].y}`;

    }


    path += ' Z';


    return path;

}


/* =====================================================
   ПОКАЗ PATH
===================================================== */

function updatePathOutput(polygon) {

    pathOutput.value =
        polygonToPath(
            polygon
        );

}


/* =====================================================
   ИЗМЕНЕНИЕ НАЗВАНИЯ
===================================================== */

selectedName.addEventListener(
    'input',
    function() {

        if (!selectedPolygon) {
            return;
        }


        selectedPolygon.name =
            selectedName.value;


        updateList();

    }
);


/* =====================================================
   УДАЛЕНИЕ
===================================================== */

deleteButton.addEventListener(
    'click',
    function() {

        if (!selectedPolygon) {
            return;
        }


        selectedPolygon.element.remove();


        removePolygonControls(
            selectedPolygon
        );


        polygons =
            polygons.filter(
                polygon =>
                    polygon !== selectedPolygon
            );


        selectedPolygon = null;


        parameters.style.display =
            'none';


        updateList();

    }
);


/* =====================================================
   СПИСОК
===================================================== */

function updateList() {

    polygonList.innerHTML =
        '<h3>Созданные зоны</h3>';


    polygons.forEach(
        (polygon, index) => {

            const item =
                document.createElement(
                    'div'
                );


            item.className =
                'polygon-item';


            item.innerHTML = `

                <strong>
                    ${index + 1}.
                    ${polygon.name}
                </strong>

                <br>

                Вершин:
                ${polygon.points.length}

                <div class="path-preview">
                    ${polygonToPath(polygon)}
                </div>

                <button
                    class="delete-button"
                >
                    Удалить
                </button>

            `;


            item.addEventListener(
                'click',
                function(event) {

                    if (
                        event.target.tagName
                        === 'BUTTON'
                    ) {
                        return;
                    }


                    selectPolygon(
                        polygon
                    );

                }
            );


            item.querySelector(
                'button'
            ).addEventListener(
                'click',
                function() {

                    polygon.element.remove();


                    removePolygonControls(
                        polygon
                    );


                    polygons.splice(
                        index,
                        1
                    );


                    if (
                        selectedPolygon
                        === polygon
                    ) {

                        selectedPolygon =
                            null;

                        parameters.style.display =
                            'none';

                    }


                    updateList();

                }
            );


            polygonList.appendChild(
                item
            );

        }
    );

}

</script>

</body>
</html>
