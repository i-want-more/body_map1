
<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Body Map Editor</title>


    <style>

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f2f2f2;

            display: flex;

            justify-content: center;

        }


        .app {

            padding: 20px;

            text-align: center;

        }


        h1 {

            font-size: 22px;

        }


        .controls {

            background: white;

            padding: 15px;

            border-radius: 10px;

            margin-bottom: 20px;

        }


        input {

            width: 70px;

            padding: 8px;

            margin: 4px;

        }


        .name-input {

            width: 180px;

        }


        button {

            padding: 10px 15px;

            margin: 5px;

            cursor: pointer;

        }


        .delete-button {

            background: #eee;

            border: 1px solid #ccc;

            padding: 6px 10px;

        }


        .update-button {

            background: #ddd;

            border: 1px solid #bbb;

        }


        .body-map {

            position: relative;

            width: 250px;

            margin: 20px auto;

        }


        .body-map img {

            width: 250px;

            height: 700px;

            display: block;

        }


        .zones {

            position: absolute;

            top: 0;

            left: 0;

            width: 250px;

            height: 700px;

        }


        .zone {

            fill: rgba(255, 170, 0, 0.45);

            stroke: orange;

            stroke-width: 2;

            cursor: pointer;

        }


        .zone.selected {

            fill: rgba(0, 150, 255, 0.45);

            stroke: blue;

        }


        .zone-item {

            background: white;

            padding: 10px;

            margin-top: 5px;

            text-align: left;

        }

    </style>

</head>


<body>


<div class="app">


    <h1>Редактор зон тела</h1>


    <div class="controls">


        <div>

            <input
                class="name-input"
                id="zoneName"
                type="text"
                placeholder="Название"
            >

        </div>


        <div>

            <label>

                X

                <input
                    id="x"
                    type="number"
                    value="125"
                >

            </label>


            <label>

                Y

                <input
                    id="y"
                    type="number"
                    value="350"
                >

            </label>

        </div>


        <div>

            <label>

                Ширина

                <input
                    id="width"
                    type="number"
                    value="60"
                >

            </label>


            <label>

                Высота

                <input
                    id="height"
                    type="number"
                    value="100"
                >

            </label>

        </div>


        <button onclick="addEllipse()">

            Добавить эллипс

        </button>


        <button
            class="update-button"
            onclick="updateEllipse()"
        >

            Обновить эллипс

        </button>


    </div>


    <div class="body-map">


        <img
            src="body.png"
            alt="Body"
        >


        <svg
            class="zones"
            viewBox="0 0 250 700"
        >

        </svg>


    </div>


    <div id="zonesList">

    </div>


</div>


<script>


    const svg =
        document.querySelector('.zones');


    const zonesList =
        document.querySelector('#zonesList');


    let zones = [];


    let selectedZone = null;


    // --------------------------------
    // Добавление нового эллипса
    // --------------------------------


    function addEllipse() {


        const name =
            document
            .querySelector('#zoneName')
            .value
            .trim();


        const x =
            Number(
                document.querySelector('#x').value
            );


        const y =
            Number(
                document.querySelector('#y').value
            );


        const width =
            Number(
                document.querySelector('#width').value
            );


        const height =
            Number(
                document.querySelector('#height').value
            );


        if (!name) {

            alert(
                'Введите название зоны'
            );

            return;

        }


        const ellipse =
            document.createElementNS(
                'http://www.w3.org/2000/svg',
                'ellipse'
            );


        ellipse.setAttribute(
            'class',
            'zone'
        );


        ellipse.setAttribute(
            'cx',
            x
        );


        ellipse.setAttribute(
            'cy',
            y
        );


        ellipse.setAttribute(
            'rx',
            width / 2
        );


        ellipse.setAttribute(
            'ry',
            height / 2
        );


        svg.appendChild(
            ellipse
        );


        const zone = {

            name: name,

            x: x,

            y: y,

            width: width,

            height: height,

            element: ellipse

        };


        zones.push(zone);


        // Клик по эллипсу

        ellipse.addEventListener(
            'click',
            function(event) {

                event.stopPropagation();

                selectZone(zone);

            }
        );


        updateZonesList();


        document
        .querySelector('#zoneName')
        .value = '';

    }


    // --------------------------------
    // Выбор эллипса
    // --------------------------------


    function selectZone(zone) {


        selectedZone = zone;


        // Убираем выделение

        zones.forEach(
            function(item) {

                item.element
                    .classList
                    .remove('selected');

            }
        );


        // Выделяем выбранный

        zone.element
            .classList
            .add('selected');


        // Загружаем данные

        document
        .querySelector('#zoneName')
        .value = zone.name;


        document
        .querySelector('#x')
        .value = zone.x;


        document
        .querySelector('#y')
        .value = zone.y;


        document
        .querySelector('#width')
        .value = zone.width;


        document
        .querySelector('#height')
        .value = zone.height;

    }


    // --------------------------------
    // Обновление выбранного эллипса
    // --------------------------------


    function updateEllipse() {


        if (!selectedZone) {

            alert(
                'Сначала выберите эллипс'
            );

            return;

        }


        const name =
            document
            .querySelector('#zoneName')
            .value
            .trim();


        const x =
            Number(
                document.querySelector('#x').value
            );


        const y =
            Number(
                document.querySelector('#y').value
            );


        const width =
            Number(
                document.querySelector('#width').value
            );


        const height =
            Number(
                document.querySelector('#height').value
            );


        selectedZone.name =
            name;


        selectedZone.x =
            x;


        selectedZone.y =
            y;


        selectedZone.width =
            width;


        selectedZone.height =
            height;


        selectedZone.element.setAttribute(
            'cx',
            x
        );


        selectedZone.element.setAttribute(
            'cy',
            y
        );


        selectedZone.element.setAttribute(
            'rx',
            width / 2
        );


        selectedZone.element.setAttribute(
            'ry',
            height / 2
        );


        updateZonesList();

    }


    // --------------------------------
    // Удаление зоны
    // --------------------------------


    function deleteZone(index) {


        const zone =
            zones[index];


        zone.element.remove();


        if (selectedZone === zone) {

            selectedZone = null;

        }


        zones.splice(
            index,
            1
        );


        updateZonesList();

    }


    // --------------------------------
    // Список зон
    // --------------------------------


    function updateZonesList() {


        zonesList.innerHTML =
            '<h3>Созданные зоны:</h3>';


        zones.forEach(
            function(zone, index) {


                const item =
                    document.createElement('div');


                item.className =
                    'zone-item';


                item.innerHTML = `

                    <strong>

                        ${index + 1}.
                        ${zone.name}

                    </strong>

                    <br>

                    X: ${zone.x}

                    &nbsp;&nbsp;

                    Y: ${zone.y}

                    <br>

                    Ширина: ${zone.width}

                    &nbsp;&nbsp;

                    Высота: ${zone.height}

                    <br>

                    <button
                        class="delete-button"
                        onclick="deleteZone(${index})"
                    >

                        Удалить

                    </button>

                `;


                zonesList.appendChild(
                    item
                );

            }
        );

    }


</script>


</body>

</html>
