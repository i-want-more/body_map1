<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Карта тіла</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    color: #222;
}

.app {
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
    padding: 20px;
}


/* =====================================================
   БЛОК
===================================================== */

.block {
    background: white;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 20px;
}

.block h2 {
    margin-top: 0;
    font-size: 20px;
}


/* =====================================================
   БЛОК 1 — ЗНАЧЕНИЯ
===================================================== */

.zone-input {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;

    padding: 10px 0;

    border-bottom: 1px solid #eee;
}

.zone-input:last-child {
    border-bottom: none;
}

.zone-name {
    flex: 1;
    font-size: 15px;
}

.zone-value {
    width: 65px;
    padding: 8px;

    font-size: 16px;
    text-align: center;

    border: 1px solid #ccc;
    border-radius: 6px;
}


/* =====================================================
   БЛОК 2 — ШКАЛЫ
===================================================== */

.scale-item {
    margin-bottom: 18px;
}

.scale-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 6px;

    font-size: 14px;
}

.scale {
    position: relative;

    width: 100%;
    height: 12px;

    background: #eee;
    border-radius: 10px;

    overflow: hidden;
}

.scale-fill {
    height: 100%;

    width: 0%;

    border-radius: 10px;

    transition:
        width 0.2s ease,
        background-color 0.2s ease;
}


/* =====================================================
   БЛОК 3 — ТЕЛО
===================================================== */

.body-container {
    display: flex;
    justify-content: center;

    margin-top: 10px;
}

.body-map {
    position: relative;

    width: 250px;
    height: 700px;
}

.body-map img {
    position: absolute;

    left: 0;
    top: 0;

    width: 250px;
    height: 700px;

    display: block;
}

.body-map svg {
    position: absolute;

    left: 0;
    top: 0;

    width: 250px;
    height: 700px;

    overflow: visible;
}


/* =====================================================
   ПОЛИГОНЫ
===================================================== */

.body-zone {
    fill: none;

    stroke-width: 1.5;

    transition:
        stroke 0.2s ease,
        opacity 0.2s ease;
}


/* =====================================================
   ПЕРЕКЛЮЧАТЕЛИ
===================================================== */

.visibility-list {
    margin-top: 20px;
}

.visibility-item {
    display: flex;
    align-items: center;

    gap: 10px;

    margin-bottom: 10px;
}

.visibility-item input {
    width: 18px;
    height: 18px;
}

.visibility-label {
    font-size: 14px;
}


/* =====================================================
   ЦВЕТА
===================================================== */

.level-low {
    stroke: #e53935;
}

.level-medium {
    stroke: #f0b400;
}

.level-high {
    stroke: #2e9d50;
}


/* =====================================================
   ЛЕГЕНДА
===================================================== */

.legend {
    display: flex;
    gap: 20px;

    flex-wrap: wrap;

    margin-top: 15px;

    font-size: 13px;
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
}

.legend-color {
    width: 12px;
    height: 12px;

    border-radius: 50%;
}

.legend-red {
    background: #e53935;
}

.legend-yellow {
    background: #f0b400;
}

.legend-green {
    background: #2e9d50;
}


/* =====================================================
   АДАПТАЦИЯ
===================================================== */

@media (max-width: 500px) {

    .app {
        padding: 12px;
    }

    .block {
        padding: 14px;
    }

}

</style>
</head>


<body>

<div class="app">


<!-- =====================================================
     БЛОК 1
===================================================== -->

<div class="block">

    <h2>
        Рівень опрацювання
    </h2>


    <div id="inputs"></div>

</div>



<!-- =====================================================
     БЛОК 2
===================================================== -->

<div class="block">

    <h2>
        Рівень опрацювання
    </h2>


    <div id="scales"></div>


    <div class="legend">

        <div class="legend-item">

            <span
                class="legend-color legend-red"
            ></span>

            1–4

        </div>


        <div class="legend-item">

            <span
                class="legend-color legend-yellow"
            ></span>

            5–8

        </div>


        <div class="legend-item">

            <span
                class="legend-color legend-green"
            ></span>

            9–12

        </div>

    </div>

</div>



<!-- =====================================================
     БЛОК 3
===================================================== -->

<div class="block">

    <h2>
        Карта тіла
    </h2>


    <div class="body-container">

        <div class="body-map">

            <img
                src="body.png"
                alt="Силует людини"
            >


            <svg
                viewBox="0 0 250 700"
                id="bodySvg"
            >

            </svg>

        </div>

    </div>



    <!-- Переключатели -->

    <div class="visibility-list">

        <h3>
            Області
        </h3>


        <div id="visibilityControls"></div>

    </div>

</div>


</div>



<script>


/* =====================================================
   ДАННЫЕ ЗОН
===================================================== */


const zones = [

    {
        id: "neck",

        name: "Шия",

        value: 1,

        path:
        "M 62 136 L 88 158 L 169 157 L 188 137 L 144 124 L 139 102 L 110 102 L 106 125 Z"
    },


    {
        id: "shoulders",

        name: "Плечовий пояс та руки",

        value: 1,

        path:
        "M 89 126 L 50 147 L 39 276 L 36 363 L 53 406 L 62 384 L 51 334 L 73 204 L 180 203 L 200 341 L 190 382 L 197 405 L 216 365 L 211 277 L 202 142 L 162 127 Z"
    },


    {
        id: "chest",

        name: "Грудний відділ",

        value: 1,

        path:
        "M 106 235 L 112 265 L 143 265 L 147 236 L 172 188 L 161 143 L 88 143 L 79 189 Z"
    },


    {
        id: "lower-back",

        name: "Поперек",

        value: 1,

        path:
        "M 92 325 L 161 325 L 153 301 L 159 240 L 94 241 L 100 301 Z"
    },


    {
        id: "core",

        name: "Прес та центр тіла",

        value: 1,

        path:
        "M 120 345 L 133 345 L 181 328 L 163 270 L 143 255 L 112 254 L 89 269 L 70 326 Z"
    },


    {
        id: "pelvis",

        name: "Таз і кульшові суглоби",

        value: 1,

        path:
        "M 67 384 L 120 383 L 122 370 L 131 370 L 131 383 L 185 383 L 187 350 L 179 313 L 128 326 L 72 314 L 65 348 Z"
    },


    {
        id: "thighs",

        name: "Стегна",

        value: 1,

        path:
        "M 86 483 L 121 484 L 122 371 L 130 371 L 132 483 L 165 483 L 186 368 L 185 347 L 67 349 L 65 376 Z"
    },


    {
        id: "back-legs",

        name: "Задня поверхня ніг",

        value: 1,

        path:
        "M 105 685 L 121 677 L 110 366 L 139 366 L 132 676 L 147 682 L 164 552 L 160 491 L 176 366 L 159 328 L 140 349 L 110 349 L 89 328 L 74 368 L 90 490 L 86 550 Z"
    },


    {
        id: "feet",

        name: "Стопи / голеностоп",

        value: 1,

        path:
        "M 92 691 L 125 693 L 158 691 L 149 671 L 149 640 L 102 640 L 102 673 Z"
    }

];



/* =====================================================
   ССЫЛКИ НА SVG
===================================================== */

const bodySvg =
    document.getElementById(
        "bodySvg"
    );


/* =====================================================
   СОЗДАНИЕ ПОЛИГОНОВ
===================================================== */

zones.forEach(
    zone => {

        const path =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "path"
            );


        path.setAttribute(
            "d",
            zone.path
        );


        path.setAttribute(
            "class",
            "body-zone"
        );


        path.dataset.zone =
            zone.id;


        bodySvg.appendChild(
            path
        );


        zone.element =
            path;

    }
);



/* =====================================================
   ФУНКЦИЯ ОПРЕДЕЛЕНИЯ ЦВЕТА
===================================================== */

function getLevelClass(value) {

    if (value <= 4) {

        return "level-low";

    }


    if (value <= 8) {

        return "level-medium";

    }


    return "level-high";

}



/* =====================================================
   ОБНОВЛЕНИЕ ЦВЕТА
===================================================== */

function updateZoneColor(zone) {

    zone.element.classList.remove(
        "level-low",
        "level-medium",
        "level-high"
    );


    zone.element.classList.add(
        getLevelClass(
            zone.value
        )
    );

}



/* =====================================================
   БЛОК 1
===================================================== */

const inputsContainer =
    document.getElementById(
        "inputs"
    );


zones.forEach(
    zone => {

        const row =
            document.createElement(
                "div"
            );


        row.className =
            "zone-input";


        const label =
            document.createElement(
                "label"
            );


        label.className =
            "zone-name";


        label.textContent =
            zone.name;


        const input =
            document.createElement(
                "input"
            );


        input.type =
            "number";


        input.min =
            "1";


        input.max =
            "12";


        input.step =
            "1";


        input.value =
            zone.value;


        input.className =
            "zone-value";


        input.addEventListener(
            "input",
            function() {

                let value =
                    Number(
                        input.value
                    );


                /*
                Не позволяем вводить
                значения вне диапазона.
                */

                if (
                    Number.isNaN(value)
                ) {

                    value = 1;

                }


                value =
                    Math.max(
                        1,
                        Math.min(
                            12,
                            value
                        )
                    );


                zone.value =
                    value;


                input.value =
                    value;


                updateZoneColor(
                    zone
                );


                updateScale(
                    zone
                );

            }
        );


        row.appendChild(
            label
        );

        row.appendChild(
            input
        );


        inputsContainer.appendChild(
            row
        );


        zone.input =
            input;

    }
);



/* =====================================================
   БЛОК 2 — ШКАЛЫ
===================================================== */

const scalesContainer =
    document.getElementById(
        "scales"
    );


zones.forEach(
    zone => {

        const item =
            document.createElement(
                "div"
            );


        item.className =
            "scale-item";


        const header =
            document.createElement(
                "div"
            );


        header.className =
            "scale-header";


        const name =
            document.createElement(
                "span"
            );


        name.textContent =
            zone.name;


        const value =
            document.createElement(
                "span"
            );


        value.textContent =
            zone.value;


        header.appendChild(
            name
        );

        header.appendChild(
            value
        );


        const scale =
            document.createElement(
                "div"
            );


        scale.className =
            "scale";


        const fill =
            document.createElement(
                "div"
            );


        fill.className =
            "scale-fill";


        scale.appendChild(
            fill
        );


        item.appendChild(
            header
        );


        item.appendChild(
            scale
        );


        scalesContainer.appendChild(
            item
        );


        zone.scaleFill =
            fill;

        zone.scaleValue =
            value;

    }
);



/* =====================================================
   ОБНОВЛЕНИЕ ШКАЛЫ
===================================================== */

function updateScale(zone) {

    /*
    1 = примерно 8.3%
    12 = 100%
    */

    const percent =
        (zone.value / 12) * 100;


    zone.scaleFill.style.width =
        `${percent}%`;


    zone.scaleFill.classList.remove(
        "level-low",
        "level-medium",
        "level-high"
    );


    zone.scaleFill.classList.add(
        getLevelClass(
            zone.value
        )
    );


    zone.scaleValue.textContent =
        zone.value;

}



/* =====================================================
   ПЕРЕКЛЮЧАТЕЛИ ВИДИМОСТИ
===================================================== */

const visibilityControls =
    document.getElementById(
        "visibilityControls"
    );


zones.forEach(
    zone => {

        const row =
            document.createElement(
                "label"
            );


        row.className =
            "visibility-item";


        const checkbox =
            document.createElement(
                "input"
            );


        checkbox.type =
            "checkbox";


        checkbox.checked =
            true;


        checkbox.addEventListener(
            "change",
            function() {

                zone.element.style.display =
                    checkbox.checked
                        ? ""
                        : "none";

            }
        );


        const text =
            document.createElement(
                "span"
            );


        text.className =
            "visibility-label";


        text.textContent =
            zone.name;


        row.appendChild(
            checkbox
        );


        row.appendChild(
            text
        );


        visibilityControls.appendChild(
            row
        );

    }
);



/* =====================================================
   НАЧАЛЬНОЕ СОСТОЯНИЕ
===================================================== */

zones.forEach(
    zone => {

        updateZoneColor(
            zone
        );

        updateScale(
            zone
        );

    }
);

</script>

</body>
</html>
