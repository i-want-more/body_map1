```html
<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Body Map Editor</title>


    <style>

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f2f2f2;

            display: flex;

            justify-content: center;

        }


        .app {

            padding: 20px;

            text-align: center;

        }


        h1 {

            font-size: 22px;

        }


        .controls {

            background: white;

            padding: 15px;

            border-radius: 10px;

            margin-bottom: 20px;

        }


        input {

            width: 70px;

            padding: 8px;

            margin: 4px;

        }


        .name-input {

            width: 180px;

        }


        button {

            padding: 10px 15px;

            margin: 5px;

            cursor: pointer;

        }


        .delete-button {

            background: #eee;

            border: 1px solid #ccc;

            padding: 6px 10px;

        }


        .update-button {

            background: #ddd;

            border: 1px solid #bbb;

        }


        .body-map {

            position: relative;

            width: 250px;

            margin: 20px auto;

        }


        .body-map img {

            width: 250px;

            display: block;

        }


        .zones {

            position: absolute;

            top: 0;

            left: 0;

            height: 700px;

        }


        .zone {

            fill: rgba(255, 170, 0, 0.45);

            stroke: orange;

            stroke-width: 2;

            cursor: pointer;

        }


        .zone.selected {

            fill: rgba(0, 150, 255, 0.45);

            stroke: blue;

        }


        .zone-item {

            background: white;

            padding: 10px;

            margin-top: 5px;

            text-align: left;

        }

    </style>

</head>


<body>


<div class="app">


    <h1>Редактор зон тела</h1>


    <div class="controls">


        <div>

            <input
                class="name-input"
                id="zoneName"
                type="text"
                placeholder="Название"
            >

        </div>


        <div>

            <label>

                X

                <input
                    id="x"
                    type="number"
                    value="125"
                >

            </label>


            <label>

                Y

                <input
                    id="y"
                    type="number"
                    value="350"
                >

            </label>

        </div>


        <div>

            <label>

                Ширина

                <input
                    id="width"
                    type="number"
                    value="60"
                >

            </label>


            <label>

                Высота

                <input
                    id="height"
                    type="number"
                    value="100"
                >

            </label>

        </div>


        <button onclick="addEllipse()">

            Добавить зону

        </button>


        <button
            class="update-button"
            onclick="updateEllipse()"
        >

            Обновить зону

        </button>


    </div>


    <div class="body-map">


        <img
            src="body.png"
            alt="Body"
        >


        <svg
            class="zones"
            viewBox="0 0 250 700"
        >

        </svg>


    </div>


    <div id="zonesList">

    </div>


</div>


<script>


    const svg =
        document.querySelector('.zones');


    const zonesList =
        document.querySelector('#zonesList');


    let zones = [];


    let selectedZone = null;


    // --------------------------------
    // Добавление новой зоны-полигона
    // --------------------------------

    function addEllipse() {

        const name =
            document
            .querySelector('#zoneName')
            .value
            .trim();

        const x =
            Number(
                document.querySelector('#x').value
            );

        const y =
            Number(
                document.querySelector('#y').value
            );

        const width =
            Number(
                document.querySelector('#width').value
            );

        const height =
            Number(
                document.querySelector('#height').value
            );

        if (!name) {

            alert(
                'Введите название зоны'
            );

            return;
        }

        // Начальная форма — прямоугольник.
        // После создания его вершины можно свободно двигать.
        const points = [
            { x: x - width / 2, y: y - height / 2 },
            { x: x + width / 2, y: y - height / 2 },
            { x: x + width / 2, y: y + height / 2 },
            { x: x - width / 2, y: y + height / 2 }
        ];

        const polygon =
            document.createElementNS(
                'http://www.w3.org/2000/svg',
                'polygon'
            );

        polygon.setAttribute(
            'class',
            'zone'
        );

        svg.appendChild(polygon);

        const zone = {
            name: name,
            x: x,
            y: y,
            width: width,
            height: height,
            points: points,
            element: polygon,
            handles: []
        };

        zones.push(zone);

        polygon.addEventListener(
            'click',
            function(event) {

                event.stopPropagation();

                selectZone(zone);

            }
        );

        renderZone(zone);

        selectZone(zone);

        updateZonesList();

        document
        .querySelector('#zoneName')
        .value = '';

    }


    // --------------------------------
    // Отрисовка полигона
    // --------------------------------

    function renderZone(zone) {

        zone.element.setAttribute(
            'points',
            zone.points
                .map(
                    point => `${point.x},${point.y}`
                )
                .join(' ')
        );

        // Удаляем старые точки
        zone.handles.forEach(
            handle => handle.remove()
        );

        zone.handles = [];

        // Точки показываем только у выбранной зоны
        if (selectedZone !== zone) {
            return;
        }

        zone.points.forEach(
            function(point, index) {

                const handle =
                    document.createElementNS(
                        'http://www.w3.org/2000/svg',
                        'circle'
                    );

                handle.setAttribute(
                    'class',
                    'point-handle'
                );

                handle.setAttribute(
                    'cx',
                    point.x
                );

                handle.setAttribute(
                    'cy',
                    point.y
                );

                handle.setAttribute(
                    'r',
                    '6'
                );

                handle.dataset.index = index;

                svg.appendChild(handle);

                zone.handles.push(handle);

                let dragging = false;

                handle.addEventListener(
                    'mousedown',
                    function(event) {

                        event.preventDefault();
                        event.stopPropagation();

                        dragging = true;

                    }
                );

                window.addEventListener(
                    'mousemove',
                    function(event) {

                        if (!dragging) {
                            return;
                        }

                        const rect =
                            svg.getBoundingClientRect();

                        const scaleX =
                            250 / rect.width;

                        const scaleY =
                            700 / rect.height;

                        const newX =
                            (event.clientX - rect.left) * scaleX;

                        const newY =
                            (event.clientY - rect.top) * scaleY;

                        zone.points[index].x =
                            Math.max(
                                0,
                                Math.min(250, newX)
                            );

                        zone.points[index].y =
                            Math.max(
                                0,
                                Math.min(700, newY)
                            );

                        updateZoneGeometry(zone);

                    }
                );

                window.addEventListener(
                    'mouseup',
                    function() {

                        if (!dragging) {
                            return;
                        }

                        dragging = false;

                        updateZonesList();

                    }
                );

            }
        );

    }


    // --------------------------------
    // Обновление геометрии зоны
    // --------------------------------

    function updateZoneGeometry(zone) {

        zone.element.setAttribute(
            'points',
            zone.points
                .map(
                    point => `${point.x},${point.y}`
                )
                .join(' ')
        );

        zone.handles.forEach(
            function(handle, index) {

                handle.setAttribute(
                    'cx',
                    zone.points[index].x
                );

                handle.setAttribute(
                    'cy',
                    zone.points[index].y
                );

            }
        );

        updateZoneDimensions(zone);

        if (selectedZone === zone) {

            document.querySelector('#x').value =
                Math.round(zone.x);

            document.querySelector('#y').value =
                Math.round(zone.y);

            document.querySelector('#width').value =
                Math.round(zone.width);

            document.querySelector('#height').value =
                Math.round(zone.height);

        }

    }


    // --------------------------------
    // Расчёт размеров полигона
    // --------------------------------

    function updateZoneDimensions(zone) {

        const xs =
            zone.points.map(point => point.x);

        const ys =
            zone.points.map(point => point.y);

        const minX = Math.min(...xs);
        const maxX = Math.max(...xs);
        const minY = Math.min(...ys);
        const maxY = Math.max(...ys);

        zone.x =
            (minX + maxX) / 2;

        zone.y =
            (minY + maxY) / 2;

        zone.width =
            maxX - minX;

        zone.height =
            maxY - minY;

    }


    // --------------------------------
    // Выбор зоны
    // --------------------------------

    function selectZone(zone) {

        selectedZone = zone;

        zones.forEach(
            function(item) {

                item.element
                    .classList
                    .remove('selected');

            }
        );

        zone.element
            .classList
            .add('selected');

        document
        .querySelector('#zoneName')
        .value = zone.name;

        updateZoneDimensions(zone);

        document
        .querySelector('#x')
        .value = Math.round(zone.x);

        document
        .querySelector('#y')
        .value = Math.round(zone.y);

        document
        .querySelector('#width')
        .value = Math.round(zone.width);

        document
        .querySelector('#height')
        .value = Math.round(zone.height);

        zones.forEach(
            item => renderZone(item)
        );

    }


    // --------------------------------
    // Обновление выбранной зоны
    // --------------------------------

    function updateEllipse() {

        if (!selectedZone) {

            alert(
                'Сначала выберите зону'
            );

            return;
        }

        const name =
            document
            .querySelector('#zoneName')
            .value
            .trim();

        const x =
            Number(
                document.querySelector('#x').value
            );

        const y =
            Number(
                document.querySelector('#y').value
            );

        const width =
            Number(
                document.querySelector('#width').value
            );

        const height =
            Number(
                document.querySelector('#height').value
            );

        selectedZone.name =
            name;

        // Для полигональной зоны эти поля используются
        // как удобный способ задать новый прямоугольник.
        selectedZone.points = [
            { x: x - width / 2, y: y - height / 2 },
            { x: x + width / 2, y: y - height / 2 },
            { x: x + width / 2, y: y + height / 2 },
            { x: x - width / 2, y: y + height / 2 }
        ];

        updateZoneDimensions(selectedZone);

        renderZone(selectedZone);

        updateZonesList();

    }


    // --------------------------------
    // Удаление зоны
    // --------------------------------


    function deleteZone(index) {


        const zone =
            zones[index];


        zone.element.remove();


        if (selectedZone === zone) {

            selectedZone = null;

        }


        zones.splice(
            index,
            1
        );


        updateZonesList();

    }


    // --------------------------------
    // Список зон
    // --------------------------------


    function updateZonesList() {


        zonesList.innerHTML =
            '<h3>Созданные зоны:</h3>';


        zones.forEach(
            function(zone, index) {


                const item =
                    document.createElement('div');


                item.className =
                    'zone-item';


                item.innerHTML = `

                    <strong>

                        ${index + 1}.
                        ${zone.name}

                    </strong>

                    <br>

                    Центр: X ${Math.round(zone.x)}
                    &nbsp;&nbsp;
                    Y ${Math.round(zone.y)}

                    <br>

                    Размер: ${Math.round(zone.width)}
                    ×
                    ${Math.round(zone.height)}

                    <br>

                    Точек: ${zone.points.length}

                    <br>

                    <button
                        class="delete-button"
                        onclick="deleteZone(${index})"
                    >

                        Удалить

                    </button>

                `;


                zonesList.appendChild(
                    item
                );

            }
        );

    }


</script>


</body>

</html>
