<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Yoga Body Map</title>

    <style>
        body {
            margin: 0;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
        }

        .body-map {
            position: relative;
            width: 250px;
            max-width: 100%;
        }

        .body-map img {
            width: 100%;
            display: block;
        }
    </style>
</head>

<body>

    <div class="body-map">
    
        <img src="body.png" alt="Body map">
    
        <svg class="zones" viewBox="0 0 250 700">
    
            <ellipse
                class="zone"
                cx="125"
                cy="350"
                rx="45"
                ry="70"
            />
    
        </svg>
    
    </div>
</body>
</html>
