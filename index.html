<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Редактор полигонов</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    display: flex;
    justify-content: center;
}

.app {
    width: 100%;
    max-width: 600px;
    padding: 20px;
    box-sizing: border-box;
}

h1 {
    font-size: 22px;
    text-align: center;
}


/* Панель */

.controls {
    background: white;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
}

button {
    padding: 10px 15px;
    margin: 4px;
    cursor: pointer;
}

input {
    padding: 8px;
}


/* Сообщение */

.message {
    margin-top: 10px;
    padding: 10px;
    background: #fff3cd;
    border-radius: 6px;
    display: none;
}


/* Карта */

.body-map {
    position: relative;
    width: 250px;
    margin: 20px auto;
}

.body-map img {
    width: 250px;
    height: 700px;
    display: block;
}

svg {
    position: absolute;
    left: 0;
    top: 0;

    width: 250px;
    height: 700px;

    overflow: visible;
}


/* Полигон */

.polygon {
    fill: rgba(255, 170, 0, 0.4);
    stroke: orange;
    stroke-width: 2;

    cursor: pointer;
}

.polygon.selected {
    fill: rgba(0, 150, 255, 0.4);
    stroke: blue;
}


/* Вершины */

.vertex {
    fill: white;
    stroke: #222;
    stroke-width: 2;

    cursor: move;
}

.vertex:hover {
    fill: orange;
}


/* Панель параметров */

.parameters {
    background: white;
    padding: 15px;
    border-radius: 10px;
    margin-top: 20px;
}

textarea {
    width: 100%;
    box-sizing: border-box;

    min-height: 100px;

    padding: 10px;

    font-family: monospace;
    font-size: 13px;

    resize: vertical;
}


/* Список */

.polygon-item {
    background: white;

    padding: 12px;

    margin-top: 8px;

    border-radius: 8px;
}

.delete-button {
    background: #eee;
    border: 1px solid #ccc;
}

</style>
</head>


<body>

<div class="app">

<h1>Редактор полигонов</h1>


<div class="controls">

    <input
        id="polygonName"
        type="text"
        placeholder="Название зоны"
    >

    <br>

    <button id="startButton">
        Создать полигон
    </button>

    <button id="finishButton">
        Завершить
    </button>

    <div
        id="message"
        class="message"
    >
        Кликайте по силуэту, чтобы создавать
        вершины полигона.
    </div>

</div>


<!-- Тело -->

<div class="body-map">

    <img
        src="body.png"
        alt="Силуэт человека"
    >

    <svg
        id="svg"
        viewBox="0 0 250 700"
    ></svg>

</div>


<!-- Параметры -->

<div
    id="parameters"
    class="parameters"
    style="display:none;"
>

    <strong>
        Выбранный полигон
    </strong>

    <p>
        Название:
    </p>

    <input
        id="selectedName"
        type="text"
    >

    <p>
        SVG path:
    </p>

    <textarea
        id="pathOutput"
        readonly
    ></textarea>

    <br>

    <button
        id="deleteButton"
        class="delete-button"
    >
        Удалить полигон
    </button>

</div>


<!-- Список -->

<div id="polygonList"></div>

</div>



<script>


/* =====================================================
   ОСНОВНЫЕ ПЕРЕМЕННЫЕ
===================================================== */


const svg =
    document.getElementById('svg');

const startButton =
    document.getElementById('startButton');

const finishButton =
    document.getElementById('finishButton');

const message =
    document.getElementById('message');

const polygonName =
    document.getElementById('polygonName');

const parameters =
    document.getElementById('parameters');

const selectedName =
    document.getElementById('selectedName');

const pathOutput =
    document.getElementById('pathOutput');

const deleteButton =
    document.getElementById('deleteButton');

const polygonList =
    document.getElementById('polygonList');


let polygons = [];

let selectedPolygon = null;

let drawing = false;

let drawingPoints = [];

let temporaryPolygon = null;

let draggingVertex = null;



/* =====================================================
   НАЧАТЬ СОЗДАНИЕ
===================================================== */


startButton.addEventListener(
    'click',
    startDrawing
);


function startDrawing() {

    if (drawing) {
        return;
    }

    drawing = true;

    drawingPoints = [];

    message.style.display = 'block';

    startButton.disabled = true;


    temporaryPolygon =
        document.createElementNS(
            'http://www.w3.org/2000/svg',
            'polygon'
        );


    temporaryPolygon.setAttribute(
        'fill',
        'rgba(255,170,0,0.25)'
    );

    temporaryPolygon.setAttribute(
        'stroke',
        'orange'
    );

    temporaryPolygon.setAttribute(
        'stroke-width',
        '2'
    );


    svg.appendChild(
        temporaryPolygon
    );

}



/* =====================================================
   КЛИК ПО SVG
===================================================== */


svg.addEventListener(
    'click',
    function(event) {

        if (!drawing) {
            return;
        }


        /*
        Не добавляем точку,
        если кликнули по вершине.
        */

        if (
            event.target.classList.contains(
                'vertex'
            )
        ) {
            return;
        }


        const point =
            getSVGPoint(event);


        drawingPoints.push(point);


        updateTemporaryPolygon();

    }
);



/* =====================================================
   ПОЛУЧИТЬ КООРДИНАТЫ SVG
===================================================== */


function getSVGPoint(event) {

    const rect =
        svg.getBoundingClientRect();


    const scaleX =
        250 / rect.width;

    const scaleY =
        700 / rect.height;


    return {

        x:
            Math.round(
                (event.clientX - rect.left)
                * scaleX
            ),

        y:
            Math.round(
                (event.clientY - rect.top)
                * scaleY
            )

    };

}



/* =====================================================
   ВРЕМЕННЫЙ ПОЛИГОН
===================================================== */


function updateTemporaryPolygon() {

    temporaryPolygon.setAttribute(

        'points',

        drawingPoints
            .map(
                point =>
                    `${point.x},${point.y}`
            )
            .join(' ')

    );

}



/* =====================================================
   ЗАВЕРШИТЬ
===================================================== */


finishButton.addEventListener(
    'click',
    finishDrawing
);


function finishDrawing() {

    if (!drawing) {
        return;
    }


    if (drawingPoints.length < 3) {

        alert(
            'Нужно минимум 3 вершины'
        );

        return;

    }


    const name =
        polygonName.value.trim()
        || `Зона ${polygons.length + 1}`;


    temporaryPolygon.remove();


    const polygon =
        document.createElementNS(
            'http://www.w3.org/2000/svg',
            'polygon'
        );


    polygon.setAttribute(
        'class',
        'polygon'
    );


    const data = {

        name: name,

        points:
            drawingPoints.map(
                point => ({
                    x: point.x,
                    y: point.y
                })
            ),

        element: polygon,

        vertices: []

    };


    polygon.setAttribute(
        'points',
        pointsToString(
            data.points
        )
    );


    svg.appendChild(
        polygon
    );


    polygons.push(data);


    polygon.addEventListener(
        'click',
        function(event) {

            event.stopPropagation();

            selectPolygon(data);

        }
    );


    createVertices(data);


    drawing = false;

    drawingPoints = [];

    temporaryPolygon = null;

    message.style.display = 'none';

    startButton.disabled = false;

    polygonName.value = '';


    updateList();


    selectPolygon(data);

}



/* =====================================================
   ПРЕОБРАЗОВАНИЕ ТОЧЕК
===================================================== */


function pointsToString(points) {

    return points
        .map(
            point =>
                `${point.x},${point.y}`
        )
        .join(' ');

}



/* =====================================================
   СОЗДАНИЕ ВЕРШИН
===================================================== */


function createVertices(polygon) {

    /*
    Удаляем старые вершины
    */

    polygon.vertices.forEach(
        vertex =>
            vertex.remove()
    );


    polygon.vertices = [];


    polygon.points.forEach(
        (point, index) => {

            const vertex =
                document.createElementNS(
                    'http://www.w3.org/2000/svg',
                    'circle'
                );


            vertex.setAttribute(
                'class',
                'vertex'
            );


            vertex.setAttribute(
                'r',
                '5'
            );


            vertex.setAttribute(
                'cx',
                point.x
            );


            vertex.setAttribute(
                'cy',
                point.y
            );


            svg.appendChild(
                vertex
            );


            polygon.vertices.push(
                vertex
            );


            /*
            Начало перетаскивания
            */

            vertex.addEventListener(
                'pointerdown',
                function(event) {

                    event.stopPropagation();


                    draggingVertex = {

                        polygon:
                            polygon,

                        index:
                            index

                    };


                    vertex.setPointerCapture(
                        event.pointerId
                    );

                }
            );


            /*
            Перемещение
            */

            vertex.addEventListener(
                'pointermove',
                function(event) {

                    if (
                        !draggingVertex
                    ) {
                        return;
                    }


                    if (
                        draggingVertex.polygon
                        !== polygon
                    ) {
                        return;
                    }


                    if (
                        draggingVertex.index
                        !== index
                    ) {
                        return;
                    }


                    const point =
                        getSVGPoint(event);


                    polygon.points[index] =
                        point;


                    updatePolygon(
                        polygon
                    );

                }
            );


            /*
            Завершение
            */

            vertex.addEventListener(
                'pointerup',
                function(event) {

                    draggingVertex = null;


                    try {

                        vertex.releasePointerCapture(
                            event.pointerId
                        );

                    } catch {}

                }
            );

        }
    );

}



/* =====================================================
   ОБНОВЛЕНИЕ POLYGON
===================================================== */


function updatePolygon(polygon) {

    polygon.element.setAttribute(

        'points',

        pointsToString(
            polygon.points
        )

    );


    /*
    Пересоздаём вершины,
    чтобы они получили новые координаты.
    */

    createVertices(polygon);


    /*
    Обновляем path
    */

    updatePathOutput(polygon);


    /*
    Обновляем список
    */

    updateList();

}



/* =====================================================
   ВЫБОР ПОЛИГОНА
===================================================== */


function selectPolygon(polygon) {

    selectedPolygon =
        polygon;


    polygons.forEach(
        item => {

            item.element.classList.remove(
                'selected'
            );

        }
    );


    polygon.element.classList.add(
        'selected'
    );


    parameters.style.display =
        'block';


    selectedName.value =
        polygon.name;


    updatePathOutput(
        polygon
    );

}



/* =====================================================
   PATH
===================================================== */


function polygonToPath(polygon) {

    if (
        !polygon.points.length
    ) {
        return '';
    }


    let path =
        `M ${polygon.points[0].x} ${polygon.points[0].y}`;


    for (
        let i = 1;
        i < polygon.points.length;
        i++
    ) {

        path +=
            ` L ${polygon.points[i].x} ${polygon.points[i].y}`;

    }


    path += ' Z';


    return path;

}



function updatePathOutput(polygon) {

    pathOutput.value =
        polygonToPath(
            polygon
        );

}



/* =====================================================
   ИЗМЕНЕНИЕ НАЗВАНИЯ
===================================================== */


selectedName.addEventListener(
    'input',
    function() {

        if (!selectedPolygon) {
            return;
        }


        selectedPolygon.name =
            selectedName.value;


        updateList();

    }
);



/* =====================================================
   УДАЛЕНИЕ
===================================================== */


deleteButton.addEventListener(
    'click',
    function() {

        if (!selectedPolygon) {
            return;
        }


        selectedPolygon.element.remove();


        selectedPolygon.vertices.forEach(
            vertex =>
                vertex.remove()
        );


        polygons =
            polygons.filter(
                polygon =>
                    polygon !== selectedPolygon
            );


        selectedPolygon = null;


        parameters.style.display =
            'none';


        updateList();

    }
);



/* =====================================================
   СПИСОК ПОЛИГОНОВ
===================================================== */


function updateList() {

    polygonList.innerHTML =
        '<h3>Созданные зоны</h3>';


    polygons.forEach(
        (polygon, index) => {

            const item =
                document.createElement(
                    'div'
                );


            item.className =
                'polygon-item';


            item.innerHTML = `

                <strong>
                    ${index + 1}.
                    ${polygon.name}
                </strong>

                <br>

                Вершин:
                ${polygon.points.length}

                <br>

                <button
                    class="delete-button"
                    data-index="${index}"
                >
                    Удалить
                </button>

            `;


            item.addEventListener(
                'click',
                function(event) {

                    if (
                        event.target.tagName
                        === 'BUTTON'
                    ) {
                        return;
                    }


                    selectPolygon(
                        polygon
                    );

                }
            );


            item.querySelector(
                'button'
            ).addEventListener(
                'click',
                function() {

                    polygon.element.remove();


                    polygon.vertices.forEach(
                        vertex =>
                            vertex.remove()
                    );


                    polygons.splice(
                        index,
                        1
                    );


                    if (
                        selectedPolygon
                        === polygon
                    ) {

                        selectedPolygon =
                            null;

                        parameters.style.display =
                            'none';

                    }


                    updateList();

                }
            );


            polygonList.appendChild(
                item
            );

        }
    );

}


</script>

</body>
</html>
